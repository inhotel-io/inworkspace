name: inworkspace-console-e2e

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.16
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${E2E_ADMIN_SECRET:?set by e2e/run.mjs}"
      STALWART_HOSTNAME: mail.example.test
    ports:
      - "18080:8080"
      - "12525:25"
    volumes:
      - ./stalwart:/etc/stalwart:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: console
      POSTGRES_DB: console
    ports:
      - "15432:5432"
